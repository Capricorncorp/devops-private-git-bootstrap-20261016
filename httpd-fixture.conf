ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 8080
PidFile "/run/httpd.pid"

LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authn_file_module modules/mod_authn_file.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_user_module modules/mod_authz_user.so
LoadModule auth_basic_module modules/mod_auth_basic.so
LoadModule alias_module modules/mod_alias.so
LoadModule env_module modules/mod_env.so
LoadModule mime_module modules/mod_mime.so
LoadModule cgi_module modules/mod_cgi.so

User daemon
Group daemon
ServerTokens Prod
ServerSignature Off
TraceEnable Off
ErrorLog /proc/self/fd/2
LogLevel warn

StartServers 1
MinSpareServers 1
MaxSpareServers 2
ServerLimit 4
MaxRequestWorkers 4
MaxConnectionsPerChild 200
Timeout 60
KeepAlive On
KeepAliveTimeout 2

TypesConfig conf/mime.types
DocumentRoot "/srv/www"

<Directory "/">
    AllowOverride None
    Options None
    Require all denied
</Directory>

<Directory "/srv/www">
    AllowOverride None
    Options None
    Require all denied
</Directory>

<LocationMatch "^/health[.]html$">
    Require all granted
</LocationMatch>

SetEnv GIT_PROJECT_ROOT /srv/git
SetEnv GIT_HTTP_EXPORT_ALL 1
ScriptAliasMatch "^/git/(fixture[.]git(?:/.*)?)$" "/usr/local/apache2/cgi-bin/git-http-backend/$1"

<Directory "/usr/local/apache2/cgi-bin">
    AllowOverride None
    Options +ExecCGI -Indexes
    AcceptPathInfo On
    Require all granted
</Directory>

<Location "/git/">
    AuthType Basic
    AuthName "Disposable private Git fixture"
    AuthBasicProvider file
    AuthUserFile "/run/mirror-reader.htpasswd"
    <RequireAll>
        Require user fixture-reader
        Require expr "%{REQUEST_METHOD} == 'GET' || %{REQUEST_METHOD} == 'POST'"
    </RequireAll>
    # Reject push discovery as well as the receive-pack RPC endpoint below.
    <If "%{QUERY_STRING} =~ /(?:^|&)service=git-receive-pack(?:&|$)/">
        Require all denied
    </If>
</Location>

<LocationMatch "^/git/.*[/]git-receive-pack(?:/.*)?$">
    Require all denied
</LocationMatch>
